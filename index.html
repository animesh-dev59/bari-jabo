<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশের ইন্টারেক্টিভ মানচিত্র</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS for Map Hover and Active states -->
    <style>
        .division-path { 
            transition: fill 0.3s ease, transform 0.3s ease; 
            cursor: pointer; 
        }
        .division-path:hover { 
            fill: #10b981; /* Tailwind emerald-500 */ 
            transform: scale(1.01);
        }
        .active-division { 
            fill: #059669 !important; /* Tailwind emerald-600 */ 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header Section -->
    <header class="bg-green-700 text-white p-5 shadow-md text-center">
        <h1 class="text-3xl font-bold">বাংলাদেশের বিভাগীয় মানচিত্র</h1>
        <p class="text-sm mt-2 text-green-100">যেকোনো বিভাগে ক্লিক করে বিস্তারিত তথ্য জানুন</p>
    </header>
    <!-- Main Content Container -->
    <main class="container mx-auto p-4 flex flex-col md:flex-row gap-6 mt-6">

        <!-- Map Section (Left Side) -->
        <section class="w-full md:w-1/2 bg-white rounded-xl shadow-lg p-4 flex justify-center items-center">
            
            <!-- SVG Map of Bangladesh -->
            <svg viewBox="0 0 500 600" class="w-full h-auto max-h-[550px]" stroke="#ffffff" stroke-width="2">
                <g id="bangladesh-map">
                    <!-- রংপুর -->
                    <path id="rangpur" class="division-path fill-green-300" onclick="showDetails('rangpur')" d="... রংপুর এর SVG Path এখানে বসবে ..."></path>
                    
                    <!-- রাজশাহী -->
                    <path id="rajshahi" class="division-path fill-green-400" onclick="showDetails('rajshahi')" d="... রাজশাহী এর SVG Path এখানে বসবে ..."></path>
                    
                    <!-- ময়মনসিংহ -->
                    <path id="mymensingh" class="division-path fill-green-300" onclick="showDetails('mymensingh')" d="... ময়মনসিংহ এর SVG Path এখানে বসবে ..."></path>
                    
                    <!-- সিলেট -->
                    <path id="sylhet" class="division-path fill-green-500" onclick="showDetails('sylhet')" d="... সিলেট এর SVG Path এখানে বসবে ..."></path>
                    
                    <!-- ঢাকা -->
                    <path id="dhaka" class="division-path fill-green-600" onclick="showDetails('dhaka')" d="... ঢাকা এর SVG Path এখানে বসবে ..."></path>
                    
                    <!-- খুলনা -->
                    <path id="khulna" class="division-path fill-green-400" onclick="showDetails('khulna')" d="... খুলনা এর SVG Path এখানে বসবে ..."></path>
                    
                    <!-- বরিশাল -->
                    <path id="barishal" class="division-path fill-green-500" onclick="showDetails('barishal')" d="... বরিশাল এর SVG Path এখানে বসবে ..."></path>
                    
                    <!-- চট্টগ্রাম -->
                    <path id="chattogram" class="division-path fill-green-700" onclick="showDetails('chattogram')" d="... চট্টগ্রাম এর SVG Path এখানে বসবে ..."></path>
                </g>
            </svg>

        </section>
        <!-- Information Panel Section (Right Side) -->
        <section class="w-full md:w-1/2 bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-2xl font-bold text-gray-700 mb-4 border-b-2 border-green-200 pb-2">বিভাগের তথ্য</h2>

            <!-- Default Message (ক্লিক করার আগে যা দেখাবে) -->
            <div id="default-message" class="flex flex-col items-center justify-center h-full text-gray-400 min-h-[350px]">
                <svg class="w-20 h-20 mb-4 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                <p class="text-lg">বিস্তারিত জানতে মানচিত্রের যেকোনো বিভাগে ক্লিক করুন</p>
            </div>

            <!-- Details Container (ক্লিক করার পর যা দেখাবে) -->
            <div id="info-panel" class="hidden h-full">
                <h3 id="div-name" class="text-3xl font-extrabold text-green-700 mb-6">বিভাগের নাম</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-gray-700">
                    <div class="bg-green-50 border border-green-100 p-4 rounded-lg shadow-sm">
                        <span class="font-bold block text-green-800 mb-1">প্রতিষ্ঠাকাল:</span>
                        <span id="div-established" class="text-lg"></span>
                    </div>
                    <div class="bg-green-50 border border-green-100 p-4 rounded-lg shadow-sm">
                        <span class="font-bold block text-green-800 mb-1">মোট জেলা:</span>
                        <span id="div-districts" class="text-lg"></span>
                    </div>
                    <div class="bg-green-50 border border-green-100 p-4 rounded-lg shadow-sm">
                        <span class="font-bold block text-green-800 mb-1">আয়তন:</span>
                        <span id="div-area" class="text-lg"></span>
                    </div>
                    <div class="bg-green-50 border border-green-100 p-4 rounded-lg shadow-sm">
                        <span class="font-bold block text-green-800 mb-1">জনসংখ্যা:</span>
                        <span id="div-population" class="text-lg"></span>
                    </div>
                </div>

                <div class="mt-6 bg-blue-50 border border-blue-100 p-4 rounded-lg shadow-sm">
                    <span class="font-bold block text-blue-800 mb-2">জেলার নামসমূহ:</span>
                    <p id="div-district-names" class="text-md leading-relaxed text-gray-600"></p>
                </div>
            </div>

        </section>

    </main>
    </body>
